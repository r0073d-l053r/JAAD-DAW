# JAAD Stems (Demucs) sidecar — kept OUT of the main docker-compose.yml on
# purpose: the torch image is ~2.5GB and most users won't run it. Start with:
#
#   docker compose -f docker-compose.stems.yml up -d --build
#
# Then point JAAD at it (Stem Separation Studio → server field, or
# localStorage 'jaad_stems_url'). Default: http://localhost:8000

services:
  stems:
    build:
      context: ./docker-demucs
    ports:
      # Loopback-only, same posture as the DSP sidecar. Front with an
      # authenticated reverse proxy to expose it beyond this machine.
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Local-only escape hatch. For any non-local deployment set a strong
      # JAAD_STEMS_TOKEN instead (and mirror it in localStorage 'jaad_stems_token').
      - JAAD_STEMS_ALLOW_NO_AUTH=1
      - JAAD_STEMS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # Persist downloaded Demucs model weights (~300MB-2GB) across restarts.
      - demucs-models:/home/jaad/.cache
    restart: unless-stopped
    container_name: jaad-stems
    # GPU (your AI server): uncomment below AND switch the Dockerfile's torch
    # index-url to the CUDA build. Requires nvidia-container-toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  demucs-models:
