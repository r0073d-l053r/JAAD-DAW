services:
  jaad:
    build:
      context: .
      args:
        # Passes the GEMINI_API_KEY from the host environment to the build context
        - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "3000:80"
    restart: unless-stopped
    container_name: jaad-app
    depends_on:
      dsp:
        condition: service_healthy
    # --- Hardening (defense in depth) ---------------------------------------
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    # Drop all Linux caps, add back only what nginx needs to bind :80 and drop to
    # its worker user. Smoke-tested on musebot 2026-07-23: serves normally.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    # Optional further tightening (untested here): read-only root FS + tmpfs for
    # the paths nginx writes.
    # read_only: true
    # tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]

  dsp:
    build:
      context: ./docker-dsp
    ports:
      # Bind to loopback only so the VST bridge is not exposed on every host
      # interface. Front it with an authenticated reverse proxy to expose it.
      - "127.0.0.1:8080:8080"
      # noVNC (live plugin GUI). Also loopback-only; set JAAD_VNC_PASSWORD and
      # proxy it if you need remote access.
      - "127.0.0.1:6080:6080"
    volumes:
      # Plugins live here, plus the auto-generated .dsp_token (mode 0600). Make
      # ./vst writable by the container's non-root uid (1000) — e.g.
      # `mkdir -p vst && chown 1000:1000 vst`. Because it now holds a secret,
      # avoid world-readable perms on a shared host.
      - ./vst:/vst
    environment:
      - PYTHONUNBUFFERED=1
      # Authenticated by DEFAULT. With no token set, the sidecar auto-generates
      # one on first boot and prints it in the logs (`docker compose logs dsp`) —
      # paste it into JAAD Settings → DSP token. To pin a fixed token instead,
      # uncomment and set JAAD_DSP_TOKEN (mirror it in localStorage
      # 'jaad_dsp_token'). Trusted localhost only: JAAD_DSP_ALLOW_NO_AUTH=1
      # disables the token entirely — never on an exposed host.
      # - JAAD_DSP_TOKEN=change-me-to-a-long-random-secret
      # Comma-separated browser origins allowed to connect.
      - JAAD_DSP_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # Over-the-wire plugin upload EXECUTES the uploaded binary under Wine. Off
      # by default; enable ONLY on a trusted, single-operator host:
      # - JAAD_ENABLE_PLUGIN_UPLOAD=1
    restart: unless-stopped
    container_name: jaad-dsp
    # --- Hardening (defense in depth around the Wine plugin surface) ---------
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 3g
    # Drop all Linux caps — highest-value here since this container runs plugin
    # code under Wine. Smoke-tested on musebot 2026-07-23: the Wine bridge loads
    # plugins fine with ALL caps dropped. (jackd logs a harmless "Cannot lock down
    # memory" — dropping CAP_IPC_LOCK blocks mlock, but --no-realtime doesn't need
    # it. read_only is impractical: Wine writes ~/.wine, Xvfb writes /tmp.)
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8080))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # AI stem separation (Demucs) — OPT-IN via the "stems" profile because the
  # torch image is ~2.5GB and model weights download on first run:
  #
  #   docker compose --profile stems up -d --build     # everything incl. stems
  #   docker compose up -d                             # app + dsp only
  #
  # (Or set COMPOSE_PROFILES=stems in a .env to make it default on a host.)
  # Point JAAD at it via the Stem Separation Studio server field, or
  # localStorage 'jaad_stems_url'. Default: http://localhost:8000
  # NOTE: Docker CI builds explicit bake targets (jaad dsp) — bake ignores
  # profiles, so keep stems out of CI by not adding it to the bake target list.
  stems:
    profiles: ["stems"]
    build:
      context: ./docker-demucs
      # GPU hosts: switch to the CUDA torch wheel for ~10-30x faster separation
      # (requires nvidia-container-toolkit + the deploy block below):
      #   args:
      #     TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
    ports:
      # Loopback-only, same posture as the DSP sidecar. Front with an
      # authenticated reverse proxy to expose it beyond this machine.
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Authenticated by DEFAULT. With no token set, the sidecar auto-generates
      # one on first boot and prints it in the logs (`docker compose logs stems`)
      # — mirror it in localStorage 'jaad_stems_token'. To pin a fixed token,
      # uncomment JAAD_STEMS_TOKEN. (JAAD_STEMS_ALLOW_NO_AUTH=1 disables auth —
      # trusted localhost only.)
      # - JAAD_STEMS_TOKEN=change-me-to-a-long-random-secret
      - JAAD_STEMS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # Persist downloaded Demucs model weights (~300MB-2GB) + the auto-generated
      # .stems_token across restarts.
      - demucs-models:/home/jaad/.cache
    restart: unless-stopped
    container_name: jaad-stems
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Smoke-tested on musebot 2026-07-23: GPU Demucs separates fine with all caps
    # dropped (nvidia device access uses cgroups, not Linux caps).
    cap_drop: ["ALL"]
    # Demucs (torch) memory scales with track length + model, so mem_limit is left
    # opt-in: set a ceiling that fits your host to bound abuse (too low will
    # OOM-kill a real separation):
    # mem_limit: 8g
    # GPU passthrough (pairs with the CUDA build arg above):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  demucs-models:

