services:
  jaad:
    build:
      context: .
      args:
        # Passes the GEMINI_API_KEY from the host environment to the build context
        - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "3000:80"
    restart: unless-stopped
    container_name: jaad-app
    depends_on:
      dsp:
        condition: service_healthy

  dsp:
    build:
      context: ./docker-dsp
    ports:
      - "8080:8080"
    volumes:
      - ./vst:/vst
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    container_name: jaad-dsp
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8080))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

