services:
  jaad:
    build:
      context: .
      args:
        # Passes the GEMINI_API_KEY from the host environment to the build context
        - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "3000:80"
    restart: unless-stopped
    container_name: jaad-app
    depends_on:
      dsp:
        condition: service_healthy

  dsp:
    build:
      context: ./docker-dsp
    ports:
      # Bind to loopback only so the VST bridge is not exposed on every host
      # interface. Front it with an authenticated reverse proxy to expose it.
      - "127.0.0.1:8080:8080"
      # noVNC (live plugin GUI). Also loopback-only; set JAAD_VNC_PASSWORD and
      # proxy it if you need remote access.
      - "127.0.0.1:6080:6080"
    volumes:
      # Mount plugins read-only; the bridge only needs to load them.
      - ./vst:/vst:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Origin-checked but token-less by default so it starts out of the box.
      # For any non-local deployment, set a strong JAAD_DSP_TOKEN instead and
      # configure it in the app (localStorage 'jaad_dsp_token'), then remove this.
      - JAAD_DSP_ALLOW_NO_AUTH=1
      # Comma-separated browser origins allowed to connect.
      - JAAD_DSP_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped
    container_name: jaad-dsp
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8080))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

