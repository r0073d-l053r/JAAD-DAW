services:
  jaad:
    build:
      context: .
      args:
        # Passes the GEMINI_API_KEY from the host environment to the build context
        - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "3000:80"
    restart: unless-stopped
    container_name: jaad-app
    depends_on:
      dsp:
        condition: service_healthy

  dsp:
    build:
      context: ./docker-dsp
    ports:
      - "8080:8080"
    volumes:
      - ./vst:/vst
    restart: unless-stopped
    container_name: jaad-dsp
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import websockets; import asyncio; asyncio.run(websockets.connect('ws://localhost:8080'))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

