services:
  jaad:
    build:
      context: .
      args:
        # Passes the GEMINI_API_KEY from the host environment to the build context
        - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "3000:80"
    restart: unless-stopped
    container_name: jaad-app
    depends_on:
      dsp:
        condition: service_healthy

  dsp:
    build:
      context: ./docker-dsp
    ports:
      # Bind to loopback only so the VST bridge is not exposed on every host
      # interface. Front it with an authenticated reverse proxy to expose it.
      - "127.0.0.1:8080:8080"
      # noVNC (live plugin GUI). Also loopback-only; set JAAD_VNC_PASSWORD and
      # proxy it if you need remote access.
      - "127.0.0.1:6080:6080"
    volumes:
      # Plugins live here. Read-write so the drag-and-drop upload feature can
      # save a .dll/.vst3 into it (uploads are extension- and size-checked and
      # path-sanitized server-side). Make ./vst writable by the container's
      # non-root uid (1000) — e.g. `mkdir -p vst && chmod 777 vst`.
      - ./vst:/vst
    environment:
      - PYTHONUNBUFFERED=1
      # Origin-checked but token-less by default so it starts out of the box.
      # For any non-local deployment, set a strong JAAD_DSP_TOKEN instead and
      # configure it in the app (localStorage 'jaad_dsp_token'), then remove this.
      - JAAD_DSP_ALLOW_NO_AUTH=1
      # Comma-separated browser origins allowed to connect.
      - JAAD_DSP_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped
    container_name: jaad-dsp
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8080))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # AI stem separation (Demucs) — OPT-IN via the "stems" profile because the
  # torch image is ~2.5GB and model weights download on first run:
  #
  #   docker compose --profile stems up -d --build     # everything incl. stems
  #   docker compose up -d                             # app + dsp only
  #
  # (Or set COMPOSE_PROFILES=stems in a .env to make it default on a host.)
  # Point JAAD at it via the Stem Separation Studio server field, or
  # localStorage 'jaad_stems_url'. Default: http://localhost:8000
  # NOTE: Docker CI builds explicit bake targets (jaad dsp) — bake ignores
  # profiles, so keep stems out of CI by not adding it to the bake target list.
  stems:
    profiles: ["stems"]
    build:
      context: ./docker-demucs
      # GPU hosts: switch to the CUDA torch wheel for ~10-30x faster separation
      # (requires nvidia-container-toolkit + the deploy block below):
      #   args:
      #     TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
    ports:
      # Loopback-only, same posture as the DSP sidecar. Front with an
      # authenticated reverse proxy to expose it beyond this machine.
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Local-only escape hatch. For any non-local deployment set a strong
      # JAAD_STEMS_TOKEN instead (and mirror it in localStorage 'jaad_stems_token').
      - JAAD_STEMS_ALLOW_NO_AUTH=1
      - JAAD_STEMS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # Persist downloaded Demucs model weights (~300MB-2GB) across restarts.
      - demucs-models:/home/jaad/.cache
    restart: unless-stopped
    container_name: jaad-stems
    # GPU passthrough (pairs with the CUDA build arg above):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  demucs-models:

