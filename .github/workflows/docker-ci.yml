name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege: this workflow only builds/tests, it never writes to the repo.
permissions:
  contents: read

jobs:
  docker-test:
    name: Build and Test Docker Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create local vst directory
        run: mkdir -p vst

      - name: Build Docker images
        # Explicit targets (jaad dsp): bake does not understand compose profiles,
        # so without them it would also build the opt-in "stems" service — a
        # ~2.5GB torch image we deliberately keep out of CI.
        run: |
          docker buildx bake -f docker-compose.yml jaad dsp --set *.cache-from=type=gha --set *.cache-to=type=gha,mode=max --load

      - name: Start Docker containers
        run: |
          docker compose up -d

      - name: Verify service health
        run: |
          echo "Waiting for services to initialize..."
          # Wait up to 60 seconds for dsp healthcheck to pass and jaad to start
          for i in {1..12}; do
            DSP_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' jaad-dsp 2>/dev/null || echo "unknown")
            APP_STATUS=$(docker inspect --format='{{json .State.Status}}' jaad-app 2>/dev/null || echo "unknown")
            
            echo "jaad-dsp health: $DSP_HEALTH"
            echo "jaad-app status: $APP_STATUS"
            
            if [ "$DSP_HEALTH" = "\"healthy\"" ] && [ "$APP_STATUS" = "\"running\"" ]; then
              echo "All services are up and healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "Error: Services failed to become healthy in time."
          exit 1

      - name: Dump docker logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs dsp
          docker compose logs jaad

      - name: Shutdown Docker containers
        if: always()
        run: |
          docker compose down
