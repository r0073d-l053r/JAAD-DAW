name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-test:
    name: Build and Test Docker Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create local vst directory
        run: mkdir -p vst

      - name: Build Docker images
        run: |
          docker buildx bake -f docker-compose.yml --set *.cache-from=type=gha --set *.cache-to=type=gha,mode=max --load

      - name: Start Docker containers
        run: |
          docker compose up -d dsp
          echo "Waiting 5s for dsp to start..."
          sleep 5
          echo "DSP logs:"
          docker compose logs dsp
          echo "Starting the rest of the stack..."
          docker compose up -d

      - name: Verify service health
        run: |
          echo "Waiting for services to initialize..."
          # Wait up to 60 seconds for dsp healthcheck to pass and jaad to start
          for i in {1..12}; do
            DSP_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' jaad-dsp 2>/dev/null || echo "unknown")
            APP_STATUS=$(docker inspect --format='{{json .State.Status}}' jaad-app 2>/dev/null || echo "unknown")
            
            echo "jaad-dsp health: $DSP_HEALTH"
            echo "jaad-app status: $APP_STATUS"
            
            if [ "$DSP_HEALTH" = "\"healthy\"" ] && [ "$APP_STATUS" = "\"running\"" ]; then
              echo "All services are up and healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "Error: Services failed to become healthy in time."
          docker compose ps
          docker compose logs
          exit 1

      - name: Shutdown Docker containers
        if: always()
        run: |
          docker compose down
