name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege: these jobs only need to read the repo.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # scan the whole history, not just the tip
          persist-credentials: false
      # Blocking: a detected secret fails the run so it can't merge.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln-scan:
    name: Dependency & config scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Report-only for now (exit-code 0). Once findings are triaged, set
      # exit-code: 1 to make HIGH/CRITICAL block merges.
      # NOTE: @master is Aqua's documented ref; Dependabot (github-actions) will
      # pin/update it.
      - name: Trivy filesystem + misconfig scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
