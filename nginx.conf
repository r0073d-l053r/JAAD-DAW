# JAAD production nginx config: serves the built SPA with the security headers
# the app needs (cross-origin isolation for Wasm SIMD / SharedArrayBuffer) plus
# standard hardening. Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (applied to every response) -----------------------
    # NOTE: nginx does NOT inherit add_header into a location block that has its
    # own add_header. Keep header directives here at server scope and avoid
    # per-location add_header so every response stays protected.

    # Cross-origin isolation — required for SharedArrayBuffer / Wasm SIMD
    # (essentia.js BPM, vectorized DSP). Mirrors the Vite dev server headers.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;

    # Content-Security-Policy. Tighten host lists to your own Firebase project.
    # 'wasm-unsafe-eval' is needed for essentia's WebAssembly; 'unsafe-inline'
    # in style-src covers Tailwind + the dynamic Liquid Glass inline styles.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' blob: data: https://*.googleapis.com https://firebasestorage.googleapis.com https://storage.googleapis.com https://generativelanguage.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com ws://localhost:8080 ws://127.0.0.1:8080" always;

    # SPA routing at the site root.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app is built with Vite base '/JAAD-DAW/'; map that prefix onto the
    # same files so absolute asset URLs (/JAAD-DAW/assets/...) resolve.
    location /JAAD-DAW/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }
}
