# JAAD production nginx config: serves the built SPA with the security headers
# the app needs (cross-origin isolation for Wasm SIMD / SharedArrayBuffer) plus
# standard hardening. Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app is built with Vite base '/JAAD-DAW/'. Strip that prefix up front
    # so a single location tree (and the .mjs type fix below) serves both
    # /JAAD-DAW/... and bare /... paths identically.
    rewrite ^/JAAD-DAW/(.*)$ /$1;

    # --- Security headers (applied to every response) -----------------------
    # NOTE: nginx does NOT inherit add_header into a location block that has its
    # own add_header. Keep header directives here at server scope and avoid
    # per-location add_header so every response stays protected.

    # Cross-origin isolation — required for SharedArrayBuffer / Wasm SIMD
    # (essentia.js BPM, vectorized DSP, threaded onnxruntime). "credentialless"
    # (not require-corp) so cross-origin subresources like Google Fonts still
    # load; isolation guarantees are equivalent for our purposes.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;

    # Content-Security-Policy. Tighten host lists to your own Firebase project.
    # script-src: 'wasm-unsafe-eval' for WebAssembly compilation, and
    # 'unsafe-eval' because essentia.js's Emscripten loader constructs its
    # module via new Function(...) — without it BPM detection throws EvalError.
    # 'unsafe-inline' in style-src covers Tailwind + Liquid Glass inline styles.
    # fonts.googleapis/gstatic: the app's Inter/JetBrains Mono fonts.
    # huggingface.co / *.hf.co: one-time download of the on-device Demucs ONNX
    # model for in-browser (WebGPU/WASM) stem separation (ADR-0010).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' blob: data: https://*.googleapis.com https://firebasestorage.googleapis.com https://storage.googleapis.com https://generativelanguage.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://huggingface.co https://*.hf.co ws://localhost:8080 ws://127.0.0.1:8080" always;

    # ES-module scripts: stock nginx mime.types has no .mjs mapping, so these
    # would ship as application/octet-stream — and browsers enforce strict MIME
    # checking for module scripts (this breaks onnxruntime-web's runtime loader).
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # SPA routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
